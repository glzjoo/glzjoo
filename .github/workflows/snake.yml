name: Generate contribution snake

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0d1117&color_dots=#ebedf0,#d0d7de,#8c959f,#57606a,#24292f
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#30363d,#6e7681,#adbac7,#f0f6fc
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
